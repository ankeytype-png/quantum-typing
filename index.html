<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Typing</title>
  <style>
    :root {
      --bg-color: #0a0d0e;
      --card-bg: #12181b;
      --primary: #00ffcc;
      --primary-dim: rgba(0, 255, 204, 0.2);
      --text: #d0e0e0;
      --text-dim: #608080;
      --border: #1a2928;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 { color: var(--primary); margin-bottom: 15px; letter-spacing: 2px; text-shadow: 0 0 10px var(--primary-dim); }
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .user-profile-bar { display: flex; align-items: center; gap: 10px; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #203030;
      object-fit: cover;
      border: 1px solid var(--primary);
    }
    button {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover { background: var(--primary-dim); }
    .view { display: none; }
    .view.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 0.9rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      background: #080c0d;
      border: 1px solid var(--border);
      color: var(--primary);
      border-radius: 4px;
    }

    .game-header { display: flex; justify-content: space-between; font-size: 1.1rem; margin-bottom: 20px; }
    .stats-val { color: var(--primary); font-weight: bold; }

    .word-display { text-align: center; margin: 30px 0; }
    .kanji { font-size: 1.5rem; margin-bottom: 8px; word-break: break-all; }
    .kana { font-size: 1rem; color: var(--text-dim); margin-bottom: 12px; }
    .romaji { font-size: 1.3rem; word-break: break-all; }
    .typed { color: var(--primary); text-shadow: 0 0 5px var(--primary); }
    .untyped { color: var(--text-dim); }

    .next-word-box {
      margin-top: 20px;
      padding: 10px;
      background: rgba(0,255,204,0.03);
      border-left: 3px solid var(--primary);
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .mode-select { display: flex; gap: 15px; justify-content: center; margin: 30px 0; }
    .mode-btn { padding: 15px 30px; font-size: 1.1rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--primary); }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>QUANTUM TYPING</h1>
  <div class="container">
    <nav>
      <div class="user-profile-bar">
        <img id="nav-avatar" class="avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="icon">
        <span id="nav-username">ゲスト</span>
      </div>
      <div>
        <button onclick="switchView('mode-view')">ゲーム</button>
        <button onclick="switchView('ranking-view')">ランキング</button>
  <div class="container">
    <nav>
      <div class="user-profile-bar">
        <img id="nav-avatar" class="avatar" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" alt="icon">
        <span id="nav-username">ゲスト</span>
      </div>
      <div>
        <button onclick="switchView('mode-view')">ゲーム</button>
        <button onclick="switchView('ranking-view')">ランキング</button>
        <button onclick="switchView('profile-view')">マイページ</button>
        <button onclick="switchView('auth-view')">ログイン</button>
      </div>
    </nav>

    <!-- 認証画面 -->
    <div id="auth-view" class="view">
      <h2>ログイン / 登録</h2>
      <div class="form-group" style="margin-top:15px;">
        <label>ユーザーID</label>
        <input type="text" id="auth-userid">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="auth-password">
      </div>
      <button onclick="handleAuth('login')">ログイン</button>
      <button onclick="handleAuth('register')">新規登録</button>
    </div>
    <!-- モード選択 -->
    <div id="mode-view" class="view active">
      <div class="mode-select">
        <button class="mode-btn" onclick="startGame('basic')">基本モード</button>
        <button class="mode-btn" onclick="startGame('advanced')">腕試しモード</button>
      </div>
    </div>

    <!-- タイピング画面 -->
    <div id="game-view" class="view">
      <div class="game-header">
        <div>TIME: <span id="timer" class="stats-val">60</span>s</div>
        <div>SCORE: <span id="score" class="stats-val">0</span></div>
      </div>
      <div class="word-display">
        <div id="word-kanji" class="kanji">---</div>
        <div id="word-kana" class="kana">---</div>
        <div class="romaji">
          <span id="romaji-typed" class="typed"></span><span id="romaji-untyped" class="untyped"></span>
        </div>
      </div>
      <div class="next-word-box">
        次に出てくる用語: <span id="next-word-text">-</span>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-view" class="view" style="text-align: center;">
      <h2>TIME UP!</h2>
      <p style="font-size: 1.3rem; margin: 20px 0;">最終スコア: <span id="final-score" class="stats-val">0</span></p>
      <button onclick="switchView('mode-view')">モード選択へ戻る</button>
    </div>

    <!-- マイページ -->
    <div id="profile-view" class="view">
      <h2>マイページ</h2>
      <div style="margin-top:15px;">
        <div class="form-group">
          <label>表示名</label>
          <input type="text" id="profile-name">
        </div>
        <div class="form-group">
          <label>アイコン画像URL</label>
          <input type="text" id="profile-icon-url" placeholder="https://example.com/icon.png">
        </div>
        <p>総プレイ回数: <span id="profile-play-count" class="stats-val">0</span> 回</p>
        <br>
        <button onclick="updateProfile()">保存</button>
      </div>
    </div>

    <!-- ランキング画面 -->
    <div id="ranking-view" class="view">
      <h2>ランキング</h2>
      <div style="margin: 10px 0;">
        <button onclick="loadRanking('basic')">基本</button>
        <button onclick="loadRanking('advanced')">腕試し</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>順位</th>
            <th>ユーザー</th>
            <th>スコア</th>
            <th>プレイ数</th>
          </tr>
        </thead>
        <tbody id="ranking-list"></tbody>
      </table>
    </div>

  </div>
